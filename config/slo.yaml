service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # Request "tốt" = có response_sent và latency <= 2000 ms.
    good_event: 'event == "response_sent" and latency_ms <= 2000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >-
    Baseline của tôi (10 request mẫu, fake LLM) có latency P50/P95/P99 = 150/151/151 ms và
    TTFT P95 = 50 ms, tức ngưỡng 3000 ms trong dashboard rộng gấp ~20 lần mức bình thường và
    không bắt được sự cố rag_slow (latency tăng lên khoảng 2651 ms nhưng vẫn < 3000 ms).
    Vì vậy SLO dùng ngưỡng chặt hơn là 2000 ms (cũng là latency_threshold_ms của challenge K4-L3B).
    Dashboard vẫn giữ ngưỡng 3000 ms đúng contract; SLO 2000 ms dùng cho error budget và alert.
  note: >-
    Error budget = 100% - 99.5% = 0.5%. Với 10,000 request trong 28 ngày, tối đa 50 request
    được phép lỗi hoặc chậm hơn 2000 ms (~1.8 request/ngày). Nếu dùng hết budget thì dừng release
    prompt/config mới và ưu tiên sửa độ tin cậy. Burn rate = tỉ lệ request xấu quan sát được /
    0.5%; burn rate 1 nghĩa là budget vừa đủ cho cả cửa sổ 28 ngày.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
